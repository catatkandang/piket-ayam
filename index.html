<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piket Ayam">
<title>Laporan Piket Harian Kandang Ayam Petelur</title>
<style>
  :root{
    --hijau:#2f5d3a; --hijau-muda:#e7f0e8; --merah:#b3261e; --merah-muda:#fbe9e7;
    --kuning:#8a6100; --kuning-muda:#fff4d6; --teks:#1f2421; --abu:#5f6b63;
    --garis:#d9dfda; --latar:#f5f6f2; --kartu:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--latar);color:var(--teks);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header.top{background:var(--hijau);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5}
  header.top h1{margin:0;font-size:1.08rem;font-weight:650;letter-spacing:.2px}
  header.top .sub{opacity:.85;font-size:.85rem;margin-top:2px}
  .progress{height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:10px;overflow:hidden}
  .progress>div{height:100%;width:0;background:#cfe8c4;transition:width .2s}
  main{max-width:720px;margin:0 auto;padding:12px 12px 140px}
  section.card{background:var(--kartu);border:1px solid var(--garis);border-radius:14px;margin:12px 0;overflow:hidden}
  section.card>h2{margin:0;padding:14px 16px;font-size:1rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--garis)}
  .num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--hijau-muda);color:var(--hijau);font-size:.85rem;font-weight:700}
  h2 .count{margin-left:auto;font-size:.8rem;font-weight:500;color:var(--abu)}
  .body{padding:12px 16px 16px}
  label.f{display:block;font-size:.88rem;color:var(--abu);margin:10px 0 4px}
  input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
    width:100%;font:inherit;padding:11px 12px;border:1px solid var(--garis);border-radius:10px;background:#fff;color:var(--teks)}
  input:focus,textarea:focus,select:focus{outline:2px solid #9cc5a5;border-color:#9cc5a5}
  textarea{min-height:72px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
  .seg{display:flex;border:1px solid var(--garis);border-radius:10px;overflow:hidden;margin-bottom:8px}
  .seg button{flex:1;padding:10px;border:0;background:#fff;font:inherit;font-size:.92rem;color:var(--abu)}
  .seg button.on{background:var(--hijau);color:#fff;font-weight:600}
  .seg button:disabled{color:#b8c0ba}
  .calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
  .calc div{background:var(--hijau-muda);border-radius:10px;padding:9px 11px}
  .calc small{display:block;color:var(--abu);font-size:.75rem}
  .calc b{font-size:1.1rem;color:var(--hijau)}
  .warn{background:var(--kuning-muda);color:var(--kuning);border-radius:10px;padding:9px 12px;font-size:.88rem;margin-top:10px;display:none}
  .warn.show{display:block}
  .bulk{display:flex;justify-content:flex-end;margin-bottom:4px}
  .link{background:none;border:0;color:var(--hijau);font:inherit;font-size:.86rem;font-weight:600;padding:6px 0}
  .item{border-top:1px solid var(--garis);padding:11px 0}
  .item:first-of-type{border-top:0}
  .item .q{display:flex;align-items:center;gap:10px}
  .item .q span{flex:1;font-size:.95rem}
  .ok-no{display:flex;gap:6px;flex-shrink:0}
  .ok-no button{min-width:58px;padding:9px 8px;border-radius:9px;border:1px solid var(--garis);background:#fff;font:inherit;font-size:.85rem;font-weight:600;color:var(--abu)}
  .ok-no button.ok.on{background:var(--hijau);border-color:var(--hijau);color:#fff}
  .ok-no button.no.on{background:var(--merah);border-color:var(--merah);color:#fff}
  .item.missing .q span{color:var(--merah)}
  .detail{display:none;margin-top:9px;background:var(--merah-muda);border-radius:10px;padding:10px}
  .item.bad .detail{display:block}
  .detail textarea{min-height:56px;background:#fff}
  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
  .thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--garis)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
  .addphoto{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border:1px dashed #a9b3ab;border-radius:9px;background:#fff;font-size:.85rem;color:var(--abu)}
  .addphoto input{display:none}
  .sigwrap{border:1px solid var(--garis);border-radius:10px;background:#fff;position:relative;touch-action:none}
  canvas#sig{display:block;width:100%;height:150px}
  .sigwrap .hint{position:absolute;left:12px;bottom:8px;font-size:.78rem;color:#9aa49c;pointer-events:none}
  .actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--garis);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
  .actions .in{max-width:720px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-width:120px;padding:13px 10px;border-radius:11px;border:1px solid var(--hijau);background:#fff;color:var(--hijau);font:inherit;font-weight:650}
  .btn.primary{background:var(--hijau);color:#fff}
  .btn:disabled{opacity:.5}
  .status{max-width:720px;margin:6px auto 0;font-size:.82rem;color:var(--abu);text-align:center;min-height:1em}
  .status.err{color:var(--merah)}
  .status.okk{color:var(--hijau)}
  .opt{font-weight:400;color:#8a948c}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1f2421;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  @media (max-width:420px){ .grid3{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header class="top">
  <h1 id="judul">Laporan Piket Harian Kandang Ayam Petelur</h1>
  <div class="sub" id="subjudul"></div>
  <div class="progress"><div id="prog"></div></div>
</header>

<main id="app">
  <!-- 1. Header -->
  <section class="card">
    <h2><span class="num">1</span>Info Piket</h2>
    <div class="body">
      <div class="grid2">
        <div><label class="f" for="tgl">Tanggal</label><input type="date" id="tgl"></div>
        <div><label class="f" for="jam">Jam <span class="opt">(24 jam)</span></label><input type="text" id="jam" inputmode="numeric" maxlength="5" placeholder="07:30" autocomplete="off"></div>
      </div>
      <label class="f" for="petugas">Petugas 1</label>
      <input type="text" id="petugas" autocomplete="name" placeholder="Nama lengkap">
      <label class="f" for="petugas2">Petugas 2 <span class="opt">(kosongkan jika piket sendiri)</span></label>
      <input type="text" id="petugas2" autocomplete="off" placeholder="Nama lengkap">
    </div>
  </section>

  <!-- 2. Populasi -->
  <section class="card">
    <h2><span class="num">2</span>Populasi</h2>
    <div class="body">
      <div class="grid3">
        <div><label class="f" for="awal">Ayam awal (ekor)</label><input type="number" inputmode="numeric" min="0" id="awal"></div>
        <div><label class="f" for="mati">Mati (ekor)</label><input type="number" inputmode="numeric" min="0" id="mati" value="0"></div>
        <div><label class="f" for="pisah">Dipisah sakit</label><input type="number" inputmode="numeric" min="0" id="pisah" value="0"></div>
      </div>
      <div class="calc">
        <div><small>Ayam hidup (akhir)</small><b id="c-akhir">–</b></div>
        <div><small>Mortalitas hari ini</small><b id="c-mort">–</b></div>
      </div>
      <div class="warn" id="w-pop"></div>
    </div>
  </section>

  <div id="sec-kes"></div>

  <!-- 4. Pakan -->
  <div id="sec-pakan"></div>

  <div id="sec-air"></div>

  <!-- 6. Telur -->
  <section class="card">
    <h2><span class="num">6</span>Produksi Telur</h2>
    <div class="body">
      <div class="grid2">
        <div><label class="f" for="t-total">Total telur (butir)</label><input type="number" inputmode="numeric" min="0" id="t-total"></div>
        <div><label class="f" for="t-berat">Berat total (kg)</label><input type="number" inputmode="decimal" min="0" step="0.01" id="t-berat"></div>
        <div><label class="f" for="t-layak">Layak jual</label><input type="number" inputmode="numeric" min="0" id="t-layak"></div>
        <div><label class="f" for="t-retak">Retak / pecah</label><input type="number" inputmode="numeric" min="0" id="t-retak" value="0"></div>
        <div><label class="f" for="t-kotor">Kotor</label><input type="number" inputmode="numeric" min="0" id="t-kotor" value="0"></div>
        <div><label class="f" for="t-abn">Abnormal <span class="opt">(kecil, bentuk aneh, kulit tipis)</span></label><input type="number" inputmode="numeric" min="0" id="t-abn" value="0"></div>
      </div>
      <div class="calc">
        <div><small>HDP</small><b id="c-hdp">–</b></div>
        <div><small>Rata-rata berat</small><b id="c-bt">–</b></div>
        <div><small>Pakan per ekor</small><b id="c-gpe">–</b></div>
      </div>
      <div class="warn" id="w-telur"></div>
    </div>
  </section>

  <div id="sec-kandang"></div>
  <div id="sec-sani"></div>

  <!-- 9. Penutup -->
  <section class="card">
    <h2><span class="num">9</span>Penutup</h2>
    <div class="body">
      <label class="f" for="obat">Obat / vitamin / vaksin hari ini <span class="opt">(nama, dosis, cara pemberian; kosongkan jika tidak ada)</span></label>
      <textarea id="obat" placeholder="Contoh: Vitamin A (merek) 1 g/L air minum, pagi"></textarea>
      <label class="f" for="masalah">Masalah yang ditemukan</label>
      <textarea id="masalah" placeholder="Ringkas saja; detail per butir sudah tercatat di checklist"></textarea>
      <label class="f" for="tindakan">Tindakan yang dilakukan</label>
      <textarea id="tindakan"></textarea>
      <label class="f">Foto kondisi kandang</label>
      <div class="photos" id="foto-umum"></div>
      <label class="f">Paraf oleh</label>
      <div class="seg" id="paraf-oleh">
        <button type="button" data-v="1" class="on">Petugas 1</button>
        <button type="button" data-v="2" disabled>Petugas 2</button>
      </div>
      <div class="sigwrap"><canvas id="sig"></canvas><span class="hint" id="sighint">Tanda tangan di sini</span></div>
      <div class="bulk"><button type="button" class="link" id="sigclear">Hapus paraf</button></div>
    </div>
  </section>
</main>

<div class="actions">
  <div class="in">
    <button type="button" class="btn" id="b-dl">Download PDF</button>
    <button type="button" class="btn" id="b-share">Bagikan PDF</button>
    <button type="button" class="btn primary" id="b-drive" hidden>Simpan ke Drive</button>
  </div>
  <div class="status" id="status"></div>
</div>
<div class="toast" id="toast"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script>
/* =========================================================
   PENGATURAN — ubah bagian ini saja
   ========================================================= */
const CONFIG = {
  namaPeternakan: "",            // contoh: "Peternakan Ayam Sumber Rezeki" (kosongkan jika tidak ada)
  namaKandang: "Kandang 1",
  // Isi setelah Google Apps Script di-deploy (lihat README). Kosong = tombol Drive disembunyikan.
  driveUrl: "",
  driveToken: ""                 // harus sama dengan TOKEN di Code.gs
};

/* ===== Daftar checklist (kalimat positif: OK = sesuai) ===== */
const SECTIONS = [
  { id:"kes", no:3, title:"Kesehatan Ayam", items:[
    "Ayam aktif dan lincah, tidak lesu",
    "Nafsu makan baik",
    "Tidak ada ayam sakit, lemah, atau menyendiri",
    "Tidak ada gejala pernapasan (bersin, batuk, ngorok)",
    "Tidak ada diare / kotoran tidak normal",
    "Bulu normal (tidak rontok berlebihan, tidak kusam)",
    "Jengger dan pial normal (warna dan penampilan)",
    "Tidak ada ayam luka, pincang, atau kelainan fisik"
  ]},
  { id:"pakan", no:4, title:"Pakan", pre:"pakan", items:[
    "Pakan di tempat penampungan cukup",
    "Pakan tersedia merata di sepanjang tempat pakan",
    "Saluran pakan tidak tersumbat",
    "Pakan tidak menggumpal atau berjamur",
    "Pakan tidak tercampur kotoran atau benda asing"
  ]},
  { id:"air", no:5, title:"Air Minum", items:[
    "Air minum tersedia sepanjang waktu",
    "Semua nipple drinker berfungsi",
    "Tidak ada nipple tersumbat atau bocor",
    "Tekanan dan aliran air cukup",
    "Air tidak berbau, keruh, atau tercemar",
    "Tandon air cukup",
    "Pipa dan sambungan tidak bocor"
  ]},
  { id:"kandang", no:7, title:"Kandang & Lingkungan", pre:"lingk", items:[
    "Tidak ada bau amonia menyengat",
    "Pencahayaan sesuai program",
    "Tidak ada kebocoran atap atau dinding",
    "Lantai dan saluran pembuangan baik",
    "Tidak ada genangan air",
    "Kawat kandang baterai tidak rusak / lepas",
    "Tidak ada bagian kandang yang tajam",
    "Pintu / pengunci kandang berfungsi",
    "Tidak ada ayam terjepit",
    "Telur menggelinding lancar ke penampungan",
    "Tidak ada tumpukan kotoran yang mengganggu sistem kandang"
  ]},
  { id:"sani", no:8, title:"Kebersihan & Sanitasi", items:[
    "Tempat pakan bersih",
    "Saluran air minum bersih",
    "Kotoran ayam dibersihkan sesuai jadwal",
    "Tidak ada lalat berlebihan",
    "Tidak ada tikus atau hama lain",
    "Area pengumpulan telur bersih",
    "Gudang pakan bersih dan kering",
    "Peralatan kandang bersih"
  ]}
];

/* ===== Util ===== */
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem("piket_"+k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("piket_"+k,v); }catch(e){} }
};
const num = id => { const v = $(id).value.trim(); return v===""?null:Number(v); };
const fmt = (n,d=1) => n==null||!isFinite(n) ? "–" : n.toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d});
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function setStatus(msg,cls=""){ const s=$("status"); s.textContent=msg; s.className="status "+cls; }

const answers = {};          // itemId -> {status:'ok'|'no', note:'', photos:[dataURL]}
const fotoUmum = [];
let parafOleh = "1";      // "1" | "2"         // dataURL
let dirty = false, saved = false;

/* ===== Render checklist ===== */
function renderSections(){
  SECTIONS.forEach(sec=>{
    const host = $("sec-"+sec.id);
    const card = document.createElement("section");
    card.className = "card";
    let pre = "";
    if(sec.pre==="pakan"){
      pre = `<label class="f" for="pakan-kg">Jumlah pakan diberikan hari ini (kg)</label>
             <input type="number" inputmode="decimal" min="0" step="0.1" id="pakan-kg">
             <div style="height:10px"></div>`;
    }
    if(sec.pre==="lingk"){
      pre = `<div class="grid2">
               <div><label class="f" for="suhu">Suhu (°C) <span class="opt">opsional</span></label><input type="number" inputmode="decimal" step="0.1" id="suhu"></div>
               <div><label class="f" for="rh">Kelembapan (%) <span class="opt">opsional</span></label><input type="number" inputmode="decimal" step="1" min="0" max="100" id="rh"></div>
             </div><div style="height:10px"></div>`;
    }
    card.innerHTML = `<h2><span class="num">${sec.no}</span>${sec.title}<span class="count" id="cnt-${sec.id}"></span></h2>
      <div class="body">${pre}
        <div class="bulk"><button type="button" class="link" data-allok="${sec.id}">Tandai sisanya OK</button></div>
        <div class="items"></div>
      </div>`;
    const list = card.querySelector(".items");
    sec.items.forEach((label,i)=>{
      const id = `${sec.id}-${i}`;
      answers[id] = {status:"", note:"", photos:[]};
      const el = document.createElement("div");
      el.className = "item"; el.id = "it-"+id;
      el.innerHTML = `<div class="q"><span>${label}</span>
          <div class="ok-no">
            <button type="button" class="ok" data-id="${id}" data-v="ok">OK</button>
            <button type="button" class="no" data-id="${id}" data-v="no">Tidak OK</button>
          </div></div>
        <div class="detail">
          <textarea data-note="${id}" placeholder="Keterangan: apa masalahnya, di mana, berapa ekor"></textarea>
          <div class="photos" id="ph-${id}"></div>
        </div>`;
      list.appendChild(el);
    });
    host.replaceWith(card);
  });
  SECTIONS.forEach(s=>s.items.forEach((_,i)=>renderPhotos(`${s.id}-${i}`)));
  renderPhotos(null);
}

function setAnswer(id,v){
  answers[id].status = v;
  const el = $("it-"+id);
  el.querySelector(".ok").classList.toggle("on", v==="ok");
  el.querySelector(".no").classList.toggle("on", v==="no");
  el.classList.toggle("bad", v==="no");
  el.classList.remove("missing");
  markDirty(); updateProgress();
}

/* ===== Foto ===== */
function renderPhotos(id){
  const list = id ? answers[id].photos : fotoUmum;
  const host = id ? $("ph-"+id) : $("foto-umum");
  host.innerHTML = "";
  list.forEach((src,idx)=>{
    const t = document.createElement("div"); t.className="thumb";
    t.innerHTML = `<img src="${src}" alt=""><button type="button" aria-label="Hapus foto">×</button>`;
    t.querySelector("button").onclick = ()=>{ list.splice(idx,1); renderPhotos(id); markDirty(); };
    host.appendChild(t);
  });
  if(list.length < 4){
    const lab = document.createElement("label"); lab.className="addphoto";
    lab.innerHTML = `📷 Tambah foto<input type="file" accept="image/*" capture="environment" multiple>`;
    lab.querySelector("input").onchange = async e=>{
      for(const f of [...e.target.files].slice(0, 4-list.length)){
        try{ list.push(await compress(f)); }catch(err){ toast("Foto gagal dibaca"); }
      }
      renderPhotos(id); markDirty();
    };
    host.appendChild(lab);
  }
}
function compress(file, max=1100, q=0.62){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ===== Paraf ===== */
const sig = { canvas:null, ctx:null, drawn:false };
function initSig(){
  const c = $("sig"); sig.canvas=c;
  const fit = ()=>{
    const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
    const keep = sig.drawn ? c.toDataURL() : null;
    c.width = r.width*dpr; c.height = r.height*dpr;
    sig.ctx = c.getContext("2d"); sig.ctx.scale(dpr,dpr);
    sig.ctx.lineWidth=2.2; sig.ctx.lineCap="round"; sig.ctx.lineJoin="round"; sig.ctx.strokeStyle="#1f2421";
    if(keep){ const im=new Image(); im.onload=()=>sig.ctx.drawImage(im,0,0,r.width,r.height); im.src=keep; }
  };
  fit(); window.addEventListener("resize", fit);
  let down=false;
  const pos = e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  c.addEventListener("pointerdown", e=>{ down=true; c.setPointerCapture(e.pointerId); const [x,y]=pos(e); sig.ctx.beginPath(); sig.ctx.moveTo(x,y); });
  c.addEventListener("pointermove", e=>{ if(!down) return; const [x,y]=pos(e); sig.ctx.lineTo(x,y); sig.ctx.stroke(); if(!sig.drawn){ sig.drawn=true; $("sighint").style.display="none"; markDirty(); } });
  const up=()=>{ down=false; };
  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  $("sigclear").onclick = ()=>{ sig.ctx.clearRect(0,0,c.width,c.height); sig.drawn=false; $("sighint").style.display=""; };
}

/* ===== Hitungan otomatis ===== */
function calc(){
  const awal=num("awal"), mati=num("mati")||0, pisah=num("pisah")||0;
  const akhir = awal==null ? null : awal - mati;
  const mort = awal ? mati/awal*100 : null;
  const tot=num("t-total"), berat=num("t-berat"), kg=num("pakan-kg");
  const layak=num("t-layak"), retak=num("t-retak")||0, kotor=num("t-kotor")||0, abn=num("t-abn")||0;
  const hdp = akhir && tot!=null ? tot/akhir*100 : null;
  const bt = tot && berat!=null ? berat*1000/tot : null;
  const gpe = akhir && kg!=null ? kg*1000/akhir : null;
  return {awal,mati,pisah,akhir,mort,tot,berat,kg,layak,retak,kotor,abn,hdp,bt,gpe};
}
function updateCalc(){
  const c = calc();
  $("c-akhir").textContent = c.akhir==null ? "–" : c.akhir.toLocaleString("id-ID")+" ekor";
  $("c-mort").textContent = c.mort==null ? "–" : fmt(c.mort,2)+" %";
  $("c-hdp").textContent = c.hdp==null ? "–" : fmt(c.hdp,1)+" %";
  $("c-bt").textContent = c.bt==null ? "–" : fmt(c.bt,1)+" g/butir";
  $("c-gpe").textContent = c.gpe==null ? "–" : fmt(c.gpe,0)+" g/ekor";

  const wp=[];
  if(c.awal!=null && c.mati>c.awal) wp.push("Jumlah mati lebih besar dari ayam awal.");
  if(c.akhir!=null && c.pisah>c.akhir) wp.push("Ayam dipisah lebih banyak dari ayam hidup.");
  $("w-pop").innerHTML = wp.join("<br>"); $("w-pop").classList.toggle("show", wp.length>0);

  const wt=[];
  if(c.tot!=null && c.layak!=null){
    const sum = c.layak+c.retak+c.kotor+c.abn;
    if(sum!==c.tot) wt.push(`Rincian telur (${sum} butir: layak ${c.layak} + retak ${c.retak} + kotor ${c.kotor} + abnormal ${c.abn}) tidak sama dengan total ${c.tot} butir.`);
  }
  if(c.hdp!=null && c.hdp>100) wt.push("HDP di atas 100% — cek lagi total telur atau jumlah ayam.");
  if(c.bt!=null && (c.bt<35 || c.bt>80)) wt.push(`Rata-rata ${fmt(c.bt,1)} g/butir terlihat tidak wajar — cek berat total (kg).`);
  $("w-telur").innerHTML = wt.join("<br>"); $("w-telur").classList.toggle("show", wt.length>0);
  return {c, warnings:[...wp,...wt]};
}

function updateProgress(){
  let n=0, done=0;
  SECTIONS.forEach(s=>{
    let d=0, bad=0;
    s.items.forEach((_,i)=>{ const a=answers[`${s.id}-${i}`]; if(a.status) d++; if(a.status==="no") bad++; });
    n+=s.items.length; done+=d;
    $("cnt-"+s.id).textContent = `${d}/${s.items.length}` + (bad?` · ${bad} tidak OK`:"");
  });
  $("prog").style.width = (done/n*100)+"%";
}

function markDirty(){ dirty=true; saved=false; }

/* ===== Validasi ===== */
function validate(){
  const miss=[];
  if(!$("tgl").value) miss.push("tanggal");
  if(!$("petugas").value.trim()) miss.push("nama petugas 1");
  if(!jamValid()) miss.push("jam (format 24 jam, mis. 07:30 atau 16:45)");
  if(num("awal")==null) miss.push("ayam awal");
  if(num("pakan-kg")==null) miss.push("jumlah pakan (kg)");
  if(num("t-total")==null) miss.push("total telur");
  if(num("t-layak")==null) miss.push("telur layak jual");
  let first=null, kosong=0;
  SECTIONS.forEach(s=>s.items.forEach((_,i)=>{
    const id=`${s.id}-${i}`, el=$("it-"+id);
    if(!answers[id].status){ kosong++; el.classList.add("missing"); first=first||el; }
  }));
  if(kosong) miss.push(`${kosong} butir checklist`);
  if(miss.length){
    setStatus("Belum diisi: "+miss.join(", "), "err");
    (first||$("app")).scrollIntoView({behavior:"smooth",block:"center"});
    return false;
  }
  return true;
}

/* ===== PDF ===== */
function jamValid(){ return /^([01]\d|2[0-3]):[0-5]\d$/.test($("jam").value); }
function waktu24(d){
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fileName(){
  const depan = v => (v.trim().split(/\s+/)[0]||"").replace(/[^A-Za-z0-9]/g,"");
  const nama = [depan($("petugas").value)||"Petugas", depan($("petugas2").value)].filter(Boolean).join("-");
  return `Piket_${$("tgl").value}_${$("jam").value.replace(":","")}_${nama}.pdf`;
}
function tglPanjang(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

function buildPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W=210, M=14, H=297;
  const {c, warnings} = updateCalc();
  const hijau=[47,93,58], merah=[179,38,30], abu=[95,107,99];
  let y = M;

  // Kop
  doc.setFillColor(...hijau); doc.rect(0,0,W,24,"F");
  doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(13.5);
  doc.text("LAPORAN PIKET HARIAN KANDANG AYAM PETELUR", M, 11);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.text([CONFIG.namaPeternakan, CONFIG.namaKandang].filter(Boolean).join(" — "), M, 17.5);
  y = 31;

  doc.setTextColor(31,36,33);
  doc.autoTable({
    startY:y, margin:{left:M,right:M}, theme:"plain",
    styles:{fontSize:9.5, cellPadding:1.3},
    columnStyles:{0:{cellWidth:28,textColor:abu},1:{cellWidth:62},2:{cellWidth:28,textColor:abu}},
    body:[
      ["Tanggal", tglPanjang($("tgl").value), "Petugas 1", $("petugas").value.trim()],
      ["Jam", $("jam").value+" WIB", "Petugas 2", $("petugas2").value.trim()||"-"],
      ["Kandang", CONFIG.namaKandang, "", ""]
    ]
  });
  y = doc.lastAutoTable.finalY + 4;

  // Ringkasan
  const semuaBad = [];
  SECTIONS.forEach(s=>s.items.forEach((lab,i)=>{ const a=answers[`${s.id}-${i}`]; if(a.status==="no") semuaBad.push({sec:s.title, lab, note:a.note}); }));
  sectionTitle(doc, "Ringkasan", y); y+=7;
  const v = (n,suf,d=0)=> n==null ? "-" : fmt(n,d)+suf;
  doc.autoTable({
    startY:y, margin:{left:M,right:M}, theme:"grid",
    styles:{fontSize:9.5, cellPadding:2.2, lineColor:[217,223,218]},
    headStyles:{fillColor:[231,240,232], textColor:hijau, fontStyle:"bold"},
    head:[["Ayam awal","Mati","Dipisah","Ayam hidup","Mortalitas","Pakan"]],
    body:[[v(c.awal," ekor"), v(c.mati," ekor"), v(c.pisah," ekor"), v(c.akhir," ekor"), v(c.mort," %",2), v(c.kg," kg",1)]]
  });
  doc.autoTable({
    startY:doc.lastAutoTable.finalY+2, margin:{left:M,right:M}, theme:"grid",
    styles:{fontSize:9.5, cellPadding:2.2, lineColor:[217,223,218]},
    headStyles:{fillColor:[231,240,232], textColor:hijau, fontStyle:"bold"},
    head:[["Total telur","Berat","HDP","Rata-rata","Pakan/ekor","Checklist tidak OK"]],
    body:[[v(c.tot," butir"), v(c.berat," kg",2), v(c.hdp," %",1), v(c.bt," g",1), v(c.gpe," g",0), semuaBad.length+" butir"]],
    didParseCell:d=>{ if(d.section==="body" && d.column.index===5 && semuaBad.length){ d.cell.styles.textColor=merah; d.cell.styles.fontStyle="bold"; } }
  });
  y = doc.lastAutoTable.finalY + 3;
  if(warnings.length){
    doc.setFontSize(8.5); doc.setTextColor(138,97,0);
    const lines = doc.splitTextToSize("Catatan sistem: "+warnings.join(" "), W-2*M);
    doc.text(lines, M, y+3); y += lines.length*3.8+3;
    doc.setTextColor(31,36,33);
  }

  if(semuaBad.length){
    y+=2; sectionTitle(doc, "Temuan (butir tidak OK)", y); y+=7;
    doc.autoTable({
      startY:y, margin:{left:M,right:M}, theme:"grid",
      styles:{fontSize:9, cellPadding:2, lineColor:[217,223,218]},
      headStyles:{fillColor:[251,233,231], textColor:merah},
      columnStyles:{0:{cellWidth:38},1:{cellWidth:62}},
      head:[["Bagian","Butir","Keterangan"]],
      body: semuaBad.map(b=>[b.sec, b.lab, b.note||"-"])
    });
    y = doc.lastAutoTable.finalY + 4;
  }

  // Telur rinci
  y+=2; sectionTitle(doc, "6. Produksi Telur (rincian)", y); y+=7;
  doc.autoTable({
    startY:y, margin:{left:M,right:M}, theme:"grid",
    styles:{fontSize:9.5, cellPadding:2.2, lineColor:[217,223,218]},
    headStyles:{fillColor:[231,240,232], textColor:hijau},
    head:[["Layak jual","Retak / pecah","Kotor","Abnormal","Total"]],
    body:[[v(c.layak,""), v(c.retak,""), v(c.kotor,""), v(c.abn,""), v(c.tot," butir")]]
  });
  y = doc.lastAutoTable.finalY + 4;

  // Checklist per bagian
  SECTIONS.forEach(s=>{
    let extra = "";
    if(s.id==="kandang"){
      const su=num("suhu"), rh=num("rh");
      extra = `  (Suhu: ${su==null?"-":fmt(su,1)+" °C"} · Kelembapan: ${rh==null?"-":fmt(rh,0)+" %"})`;
    }
    if(y > H-40){ doc.addPage(); y=M; }
    sectionTitle(doc, `${s.no}. ${s.title}${extra}`, y); y+=7;
    doc.autoTable({
      startY:y, margin:{left:M,right:M}, theme:"grid",
      styles:{fontSize:9, cellPadding:1.8, lineColor:[217,223,218]},
      headStyles:{fillColor:[245,246,242], textColor:abu, fontStyle:"bold"},
      columnStyles:{0:{cellWidth:8,halign:"center"},1:{cellWidth:92},2:{cellWidth:20,halign:"center",fontStyle:"bold"}},
      head:[["No","Butir pemeriksaan","Status","Keterangan"]],
      body: s.items.map((lab,i)=>{ const a=answers[`${s.id}-${i}`]; return [i+1, lab, a.status==="ok"?"OK":"TIDAK OK", a.status==="no"?(a.note||"-"):""]; }),
      didParseCell:d=>{
        if(d.section==="body" && d.column.index===2){
          d.cell.styles.textColor = d.cell.raw==="OK" ? hijau : merah;
        }
      }
    });
    y = doc.lastAutoTable.finalY + 5;
  });

  // Penutup
  if(y > H-70){ doc.addPage(); y=M; }
  sectionTitle(doc, "9. Penutup", y); y+=7;
  doc.autoTable({
    startY:y, margin:{left:M,right:M}, theme:"grid",
    styles:{fontSize:9.5, cellPadding:2.2, lineColor:[217,223,218], valign:"top"},
    columnStyles:{0:{cellWidth:45, textColor:abu}},
    body:[
      ["Obat / vitamin / vaksin", $("obat").value.trim()||"Tidak ada"],
      ["Masalah yang ditemukan", $("masalah").value.trim()||"-"],
      ["Tindakan yang dilakukan", $("tindakan").value.trim()||"-"]
    ]
  });
  y = doc.lastAutoTable.finalY + 6;

  // Paraf
  if(y > H-45){ doc.addPage(); y=M; }
  const bx = W-M-62;
  doc.setFontSize(9.5); doc.setTextColor(...abu);
  const p2 = $("petugas2").value.trim();
  const penandatangan = (parafOleh==="2" && p2) ? p2 : $("petugas").value.trim();
  doc.text(p2 ? `Petugas ${parafOleh==="2"?2:1},` : "Petugas piket,", bx, y+3);
  if(sig.drawn){
    const img = sig.canvas.toDataURL("image/png");
    const r = sig.canvas.height/sig.canvas.width;
    const w = 55, h = Math.min(24, w*r);
    doc.addImage(img, "PNG", bx, y+5, h/r, h);
  }
  doc.setDrawColor(150); doc.line(bx, y+31, bx+62, y+31);
  doc.setTextColor(31,36,33); doc.setFont("helvetica","bold");
  doc.text(penandatangan, bx, y+36);
  doc.setFont("helvetica","normal");

  // Lampiran foto
  const fotos = [];
  SECTIONS.forEach(s=>s.items.forEach((lab,i)=>{ const a=answers[`${s.id}-${i}`]; if(a.status==="no") a.photos.forEach(p=>fotos.push({src:p, cap:`${s.title}: ${lab}`})); }));
  fotoUmum.forEach(p=>fotos.push({src:p, cap:"Kondisi kandang"}));
  if(fotos.length){
    doc.addPage(); y=M;
    sectionTitle(doc, "Lampiran Foto", y); y+=8;
    const colW = (W-2*M-6)/2, boxH = 72;
    let col=0;
    fotos.forEach((f,idx)=>{
      if(y+boxH+10 > H-M){ doc.addPage(); y=M; col=0; }
      const x = M + col*(colW+6);
      const p = doc.getImageProperties(f.src);
      const s = Math.min(colW/p.width, boxH/p.height);
      const w = p.width*s, h = p.height*s;
      doc.addImage(f.src, "JPEG", x+(colW-w)/2, y+(boxH-h)/2, w, h);
      doc.setFontSize(8.3); doc.setTextColor(...abu);
      doc.text(doc.splitTextToSize(`${idx+1}. ${f.cap}`, colW), x, y+boxH+4);
      col++; if(col===2){ col=0; y+=boxH+13; }
    });
  }

  // Footer halaman
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); doc.setFontSize(7.8); doc.setTextColor(150);
    doc.text(`${fileName().replace(".pdf","")}  ·  dibuat ${waktu24(new Date())}`, M, H-7);
    doc.text(`Hal. ${i}/${n}`, W-M, H-7, {align:"right"});
  }
  return doc;
}
function sectionTitle(doc, text, y){
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(47,93,58);
  doc.text(text, 14, y+4);
  doc.setFont("helvetica","normal"); doc.setTextColor(31,36,33);
}

/* ===== Aksi ===== */
function makePdf(){
  if(!validate()) return null;
  setStatus("Membuat PDF…");
  try{
    const doc = buildPdf();
    store.set("petugas", $("petugas").value.trim());
    store.set("petugas2", $("petugas2").value.trim());
    const c = calc(); if(c.akhir!=null) store.set("akhir_terakhir", String(c.akhir));
    return doc;
  }catch(e){ console.error(e); setStatus("PDF gagal dibuat: "+e.message, "err"); return null; }
}
$("b-dl").onclick = ()=>{
  const doc = makePdf(); if(!doc) return;
  doc.save(fileName()); saved=true;
  setStatus("PDF diunduh: "+fileName(), "okk");
};
$("b-share").onclick = async ()=>{
  const doc = makePdf(); if(!doc) return;
  const file = new File([doc.output("blob")], fileName(), {type:"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:fileName(), text:`Laporan piket ${tglPanjang($("tgl").value)}, jam ${$("jam").value}`});
      saved=true; setStatus("PDF dibagikan.", "okk");
    }catch(e){ if(e.name!=="AbortError") setStatus("Gagal membagikan: "+e.message,"err"); else setStatus(""); }
  }else{
    doc.save(fileName()); saved=true;
    setStatus("HP ini tidak mendukung Bagikan, jadi PDF diunduh. Kirim manual dari folder Download.", "okk");
  }
};
$("b-drive").onclick = async ()=>{
  const doc = makePdf(); if(!doc) return;
  const btn=$("b-drive"); btn.disabled=true; setStatus("Mengunggah ke Google Drive…");
  try{
    const b64 = doc.output("datauristring").split(",")[1];
    const c = calc();
    const res = await fetch(CONFIG.driveUrl, {
      method:"POST",
      body: JSON.stringify({ token:CONFIG.driveToken, filename:fileName(), tanggal:$("tgl").value, pdf:b64,
        ringkas:{petugas:$("petugas").value.trim(), petugas2:$("petugas2").value.trim(), parafOleh, jam:$("jam").value, ...c} })
    });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error||"gagal");
    saved=true; setStatus("Tersimpan di Drive: "+out.path, "okk"); toast("Tersimpan di Google Drive ✓");
  }catch(e){
    setStatus("Gagal simpan ke Drive ("+e.message+"). Coba lagi, atau pakai Download/Bagikan.", "err");
  }finally{ btn.disabled=false; }
};
window.addEventListener("beforeunload", e=>{ if(dirty && !saved){ e.preventDefault(); e.returnValue=""; } });

/* ===== Init ===== */
function init(){
  const now = new Date(), pad=n=>String(n).padStart(2,"0");
  $("tgl").value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  $("jam").value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  $("petugas").value = store.get("petugas")||"";
  $("petugas2").value = store.get("petugas2")||"";
  // Pilihan "Paraf oleh": Petugas 2 hanya aktif kalau namanya diisi
  const segBtns = document.querySelectorAll("#paraf-oleh button");
  const syncParaf = ()=>{
    const ada2 = !!$("petugas2").value.trim();
    segBtns[1].disabled = !ada2;
    if(!ada2) parafOleh = "1";
    segBtns.forEach(b=>b.classList.toggle("on", b.dataset.v===parafOleh));
    segBtns[0].textContent = "Petugas 1" + ($("petugas").value.trim() ? " · "+$("petugas").value.trim().split(/\s+/)[0] : "");
    segBtns[1].textContent = "Petugas 2" + (ada2 ? " · "+$("petugas2").value.trim().split(/\s+/)[0] : "");
  };
  segBtns.forEach(b=>b.onclick=()=>{ if(b.disabled) return; parafOleh=b.dataset.v; syncParaf(); markDirty(); });
  $("petugas").addEventListener("input", syncParaf);
  $("petugas2").addEventListener("input", syncParaf);
  syncParaf();
  const akhirLalu = store.get("akhir_terakhir");
  if(akhirLalu) $("awal").placeholder = "Laporan terakhir di HP ini: "+akhirLalu;
  // Jam selalu format 24 jam HH:MM (titik otomatis diganti titik dua)
  $("jam").addEventListener("input", e=>{
    let v = e.target.value.replace(/[^\d]/g,"").slice(0,4);
    if(v.length>2) v = v.slice(0,2)+":"+v.slice(2);
    e.target.value = v;
  });
  $("jam").addEventListener("blur", e=>{
    const d = e.target.value.replace(/[^\d]/g,"");
    if(d.length===3) e.target.value = "0"+d[0]+":"+d.slice(1);       // 715 -> 07:15
    else if(d.length && d.length<=2) e.target.value = d.padStart(2,"0")+":00"; // 7 -> 07:00
    e.target.style.borderColor = jamValid() ? "" : "#b3261e";
  });
  if(CONFIG.namaPeternakan) $("judul").textContent = CONFIG.namaPeternakan;
  $("subjudul").textContent = (CONFIG.namaPeternakan ? "Laporan piket harian · " : "") + CONFIG.namaKandang;
  if(CONFIG.namaPeternakan) document.title = "Piket — "+CONFIG.namaPeternakan;

  renderSections(); initSig(); updateProgress(); updateCalc();
  if(CONFIG.driveUrl) $("b-drive").hidden = false;

  document.addEventListener("click", e=>{
    const b = e.target.closest(".ok-no button"); if(b){ setAnswer(b.dataset.id, b.dataset.v); return; }
    const all = e.target.closest("[data-allok]");
    if(all){ const s=SECTIONS.find(x=>x.id===all.dataset.allok); s.items.forEach((_,i)=>{ const id=`${s.id}-${i}`; if(!answers[id].status) setAnswer(id,"ok"); }); }
  });
  document.addEventListener("input", e=>{
    if(e.target.dataset.note) answers[e.target.dataset.note].note = e.target.value;
    markDirty(); updateCalc();
    if($("status").classList.contains("err")) setStatus("");
  });
}
init();
</script>
